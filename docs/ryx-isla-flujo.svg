<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Cómo funciona Ryx Isla</title>
  <desc id="desc">Las notificaciones de tus aplicaciones pasan por Ryx Isla y se muestran en una isla dinámica personalizable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171208"/><stop offset="1" stop-color="#302000"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE078"/><stop offset="1" stop-color="#E79B00"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#99F26A"/><stop offset="1" stop-color="#33B85A"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#E8A900" opacity=".08"/>
  <circle cx="145" cy="490" r="200" fill="#59C940" opacity=".06"/>
  <text x="64" y="68" fill="#FFE7A3" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">ASÍ FUNCIONA</text>
  <text x="64" y="112" fill="#FFF9E8" font-family="Arial,sans-serif" font-size="32" font-weight="700">De la notificación a tu isla</text>

  <g filter="url(#shadow)">
    <rect x="54" y="163" width="300" height="250" rx="24" fill="#FFF9EB"/>
    <rect x="77" y="188" width="44" height="44" rx="14" fill="#E9AA1B"/>
    <path d="M90 205h18M90 213h13" stroke="#342300" stroke-width="4" stroke-linecap="round"/>
    <text x="136" y="205" fill="#453A20" font-family="Arial,sans-serif" font-size="16" font-weight="700">APLICACIÓN</text>
    <text x="136" y="226" fill="#8A7B58" font-family="Arial,sans-serif" font-size="14">Notificación compatible</text>
    <rect x="78" y="254" width="252" height="1" fill="#E7DDC7"/>
    <text x="78" y="291" fill="#282316" font-family="Arial,sans-serif" font-size="20" font-weight="700">Tu actividad, al día</text>
    <text x="78" y="322" fill="#645A43" font-family="Arial,sans-serif" font-size="15">La app envía su aviso a Android.</text>
    <text x="78" y="350" fill="#645A43" font-family="Arial,sans-serif" font-size="15">Ryx Isla lo presenta en una vista</text>
    <text x="78" y="373" fill="#645A43" font-family="Arial,sans-serif" font-size="15">breve y fácil de consultar.</text>
  </g>

  <path d="M378 288h92" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="m457 276 16 12-16 12" fill="none" stroke="#FFD76A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="490" y="163" width="300" height="250" rx="24" fill="#201A0C" stroke="#614A12" stroke-width="2"/>
    <text x="640" y="208" text-anchor="middle" fill="#E9C55D" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">RYX ISLA</text>
    <rect x="535" y="244" width="210" height="85" rx="42" fill="#030303" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="572" cy="286" r="20" fill="#E8A900"/>
    <path d="M566 286h12M572 280v12" stroke="#251900" stroke-width="3" stroke-linecap="round"/>
    <rect x="610" y="267" width="94" height="7" rx="3.5" fill="#FFF7DE" opacity=".95"/>
    <rect x="610" y="284" width="65" height="6" rx="3" fill="#AB9D77"/>
    <text x="640" y="365" text-anchor="middle" fill="#F8F0D8" font-family="Arial,sans-serif" font-size="16">Contenido personalizable</text>
    <text x="640" y="389" text-anchor="middle" fill="#B8AA82" font-family="Arial,sans-serif" font-size="14">sin abrir la aplicación de origen</text>
  </g>

  <path d="M814 288h92" stroke="url(#green)" stroke-width="5" stroke-linecap="round"/>
  <path d="m893 276 16 12-16 12" fill="none" stroke="#87E36C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="926" y="163" width="220" height="250" rx="24" fill="#F5F1E5"/>
    <text x="1036" y="204" text-anchor="middle" fill="#69582B" font-family="Arial,sans-serif" font-size="15" font-weight="700">A TU MANERA</text>
    <rect x="952" y="232" width="168" height="42" rx="14" fill="#E5F5DD"/>
    <circle cx="973" cy="253" r="8" fill="#55B846"/>
    <text x="991" y="258" fill="#30432B" font-family="Arial,sans-serif" font-size="14">Música</text>
    <rect x="952" y="284" width="168" height="42" rx="14" fill="#FFF0C5"/>
    <circle cx="973" cy="305" r="8" fill="#E7A900"/>
    <text x="991" y="310" fill="#51401B" font-family="Arial,sans-serif" font-size="14">Navegación</text>
    <rect x="952" y="336" width="168" height="42" rx="14" fill="#E8E5F8"/>
    <circle cx="973" cy="357" r="8" fill="#8171D5"/>
    <text x="991" y="362" fill="#383152" font-family="Arial,sans-serif" font-size="14">Llamadas y más</text>
  </g>
</svg>
