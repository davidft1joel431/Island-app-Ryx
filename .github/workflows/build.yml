name: Build and Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Limpiar cachés de compilación
        run: |
          rm -rf app/build build .gradle app/.gradle 2>/dev/null || true
      - run: gradle clean assembleDebug --no-daemon --rerun-tasks -PbuildNumber=${{ github.run_number }}
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RyxIsland.apk
      - name: Versión
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Ryx Island v${{ steps.ver.outputs.v }}
          body: |
            - v0.9.53 corrige el Historial y la isla: solo se registran notificaciones y mensajes capturados. Se eliminan los eventos internos de batería, las marcas de revisión y los prefijos técnicos; las entradas antiguas se limpian automáticamente.
            - La captura por accesibilidad guarda lo que se vio, con el nombre de la app como título. Ya no aparece «Chat en pantalla», «(pantalla · app)» ni el tipo «Pantalla».
            - Imágenes, stickers y animaciones: los GIF/WebP animados conservan sus bytes originales y se muestran con ImageDecoder/AnimatedImageDrawable en la isla, el Historial y el visor. Las fotos grandes se reducen para no agotar memoria.
            - La isla expandida y el detalle miden exactamente 350 × 74 dp. El texto largo se desplaza dentro de una caja fija; la miniatura, los botones y la pila de apps se adaptan sin agrandar la tarjeta.
            - Una sola vista previa fija en Diseño. Se retiraron los controles de ancho expandido y margen lateral: el ancho abierto es siempre 350 dp, solo recortado si la pantalla física es más estrecha.
            - El Historial y la isla solo ofrecen copiar mensaje e imagen/sticker. Base64/binario sigue siendo el respaldo interno, invisible para el usuario.
            - Gestos: 10 copiar mensaje, 11 silenciar app y 14 copiar imagen. Los índices 12, 13 y 15 no hacen nada.
            - Sin root ni Shizuku, Ryx no promete poder absoluto: Android siempre exige confirmar cada permiso especial.
            - Se mantienen el respaldo completo, la copia en la nube, las apps clonadas, las ventanas libres, las llamadas, la conectividad y los diagnósticos.
          files: RyxIsland.apk
