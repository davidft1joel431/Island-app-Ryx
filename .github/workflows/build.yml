name: Build and Release Ryx Isla
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RyxIsla.apk
      - name: Read app version
        id: version
        run: echo "version=$(grep -oP 'versionName = \"\K[^\"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Ryx Isla v${{ steps.version.outputs.version }}
          body: |
            Ryx Isla 1.0.1.

            - Amplia la deteccion para Android 15+ en distintas marcas y ROMs.
            - Muestra la ROM detectada y la version/API de Android.
            - Mantiene la integracion nativa HyperOS como funcion opcional de Xiaomi/Redmi/POCO.
            - Incluye el icono oficial de Ryx Island.
            - Basada en Hyper Bridge bajo Apache 2.0.
          files: RyxIsla.apk
