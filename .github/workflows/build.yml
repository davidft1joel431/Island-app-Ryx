name: Build and Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RyxIsland.apk
      - name: Versión
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Ryx Island v${{ steps.ver.outputs.v }}
          body: |
            - Formato libre COMO LAS BURBUJAS: al arrastrar ya no se toca la ventana real. Aparece un MARCO FANTASMA translúcido que sigue al dedo al instante (60/120 Hz) y, al SOLTAR, la ventana se coloca en SEGUNDO PLANO con un pequeño deslizamiento (pasos interpolados): el gesto nunca se traba y la ventana «llega» a su sitio en vez de dar un salto.
            - Historial como menú: la sección de historial ahora tiene su MENÚ (Todo · Aplicaciones · Sistema), igual que Demon, para separar de un toque los avisos de tus apps de los del sistema. El buscador por texto y la descarga en .html siguen igual.
            - Interfaz más limpia y profesional: se QUITAN los registros en crudo de la vista normal. Ventana y Puente ahora muestran una tarjeta de DIAGNÓSTICO con «Ver detalle» y «Copiar», sin llenar la pantalla de texto monoespaciado.
            - Cabeceras rediseñadas con DEGRADADO del color de cada sección (Diseño, Puente, Ajustes e Historial/Demon/Permisos), icono en cuadro y bordes finos.
            - Ajustes reorganizado en secciones (Apariencia · Datos · Sistema) con encabezados, para que no parezca una lista plana.
            - Las hojas de detalle muestran el registro en un recuadro oscuro, seleccionable y fácil de copiar.
            - Formato libre FLUIDO: se elimina el arranque de un proceso «su» por fotograma (era la causa de los tirones). Ahora se mantiene UN shell root vivo y el arrastre va a un ritmo realista (~70 ms con privilegios, ~260 ms sin ellos), con la barra pegada al dedo a la velocidad de la pantalla. Mientras arrastras ya no se consulta la ventana real por binder, así el gesto no se atasca.
            - Pedidos: la isla reconoce por su paquete las apps de pedidos (Rappi, PedidosYa, Uber Eats, Glovo, iFood, Wolt, Cornershop…) y de viajes (Uber, DiDi, Cabify…), y muestra su aviso con la etiqueta «Pedido»/«Viaje» y su propio color. Ya no hay un «pedido del sistema» inventado: lo detecta la app real.
            - Demon: las pruebas de eventos se separan en su propia sección «Demon» (desde Inicio y desde Ajustes), con su cabecera propia.
            - Historial rediseñado: buscador por texto y filtro por aplicación (o «Sistema»), agrupado por DÍAS (Hoy · Ayer · fecha) y separando Aplicaciones y Sistema, cada uno con su diseño y su encabezado.
            - Historial: se guarda el TEXTO COMPLETO de cada aviso (aunque en la app se recorte) y hay un botón «Descargar como .html» que genera un archivo autónomo y presentable con TODO el texto y las imágenes, listo para abrir en cualquier navegador.
            - Diseño, Puente y Ajustes: nueva cabecera grande con color propio en cada pestaña y encabezados de sección con barra de acento.
            - Llamadas unificadas: entrante, en curso, en espera y perdida se muestran en UNA sola tarjeta con los botones REALES del sistema para CONTESTAR y COLGAR/RECHAZAR; el botón de contestar va en verde y el de colgar/rechazar en rojo, y la llamada se retira sola al terminar.
            - Wi-Fi: al conectar muestra «Conectado a la red [nombre]» con un botón «Cambiar red» que lleva a los ajustes de Wi-Fi; al desactivar la red (o caer la conexión) avisa en ROJO con accesos directos a Wi-Fi y Datos.
            - Punto de acceso: cuando compartes datos móviles se muestra una tarjeta con los dispositivos conectados (contador, también al expandir), botón «Desactivar» (con Shizuku/root) y acceso a los ajustes; se refresca sola.
            - Interfaz más profesional: nueva tarjeta principal en Inicio con el estado (activa/inactiva), estilo y tema actuales y botones «Encender/Apagar» y «Permisos»; cabecera renovada con el nombre «Ryx Island» a dos tonos.
            - Historial con secciones: ahora separa las notificaciones de las APLICACIONES de los avisos del SISTEMA (Batería, Wi-Fi, Red, Bluetooth…), cada sección con su encabezado, su color y su contador.
            - Batería a tiempo real: los avisos de batería ya no se apuntan cuatro veces ni mal; se leen del sistema en el momento y se unen en UNA sola tarjeta con el nivel actual. El historial muestra un recuadro de batería en vivo.
            - Interfaz: más color y profundidad (fondo con tres brillos, tarjetas con doble borde y acento), 3 temas nuevos (Menta, Atardecer y Medianoche) y 18 colores rápidos.
            - Diseño: 3 estilos más de isla (Océano, Rubí y Menta) y dos secciones nuevas («Acento de la app» y «Tipografía»).
            - Gestos: la distancia para deslizar es fija: 50 dp.
            - Clonados: Ryx ahora reconoce las apps clonadas (app dual / segundo espacio) con su propia clave «paquete@espacio»; «Aplicaciones» lista cada copia por separado, con su insignia, y puedes silenciar o bloquear una copia sin afectar a la otra.
            - Clonados: se detectan por la notificación de la copia, por los perfiles del sistema y, con Shizuku/root, por los usuarios que la ROM tenga (los clonados ocultos de MIUI/OPPO/Realme). Nunca se adivinan listando paquetes ajenos.
            - Formato libre: nueva variante con Shizuku/root (`am start --windowingMode 5`) que se usa primero cuando hay privilegios y se coloca al píxel con `cmd activity task resize`; sirve en ROMs que ignoran las opciones de Android.
            - Formato libre: en Android 16+ se informa del modo «Escritorio» y se lee `desktop_mode` en el diagnóstico; el icono de la app se actualiza a un fondo con degradado.
            - Interfaz: tira de «Accesos» en Inicio (Avisos, Superposición, Accesibilidad, Shizuku) con un toque para ir a Permisos; logo con anillo y pestaña activa con borde.
            - Diagnóstico: «Comprobar soporte» muestra el método con privilegios disponible y la variante de apertura recordada.
            - Nuevo modo «Burbuja (Android 17)»: ventana flotante del sistema que se queda sobre tu app, creada pulsando «Burbuja» en el launcher.
            - Barra del sistema en ventanas libres con root/Shizuku (modo escritorio en el teléfono) y apertura «Directo» instantánea por defecto.
            - Isla más sensible: zona táctil ampliada (ya no baja el panel al fallar por poco), toque más tolerante, respuesta inmediata y animaciones más rápidas.
            - Formato libre REAL del sistema por accesibilidad con «cortina» (captura de tu pantalla) para no ver el salto al inicio.
            - Nueva sección «Ventana flotante · solo accesibilidad»: usa únicamente la función de Smart Island y anota las medidas reales de la ventana.
            - Formato libre directo desde accesibilidad (como Smart Island), verificado y calibrado por ROM; ya no te saca de tu app.
            - Formato libre: abre Recientes sin ir al inicio y, si la ROM no lo permite, usa el camino del inicio (siempre abre en ventana libre).
            - Actualizaciones: lee la versión del título del release como vN, vN.N o vN.N.N, con respaldo si la API falla.
            - Visibilidad: mostrar en pantalla de bloqueo, ocultar en juegos y en apps elegidas.
            - Copia del historial y ajustes en la nube (Google Drive u otra carpeta).
            - Búsqueda de actualizaciones en GitHub con aviso de versiones de prueba.
          files: RyxIsland.apk
