name: Build and Release Ryx Isla
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk RyxIsla.apk
      - name: Read app version
        id: version
        run: echo "version=$(grep -oP 'versionName = \"\K[^\"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Ryx Isla v${{ steps.version.outputs.version }}
          body: |
            Ryx Isla 1.1.0.

            - Acumulación permanente: las notificaciones no expiran ni se borran solas.
            - Círculo lateral con el icono de la app y contador; al pulsarlo se expande la isla.
            - Detección de apps clonadas y duales por su nombre visible.
            - Indicadores del sistema en vivo: linterna, hotspot, Wi-Fi, datos, internet, Bluetooth, grabadora y música.
            - Actualización instantánea de los indicadores mediante receptores y callbacks.
            - Vista previa sincronizada con el círculo lateral y los indicadores del sistema.
            - Creador: David Joel, Perú. Inspirado en HyperOS y en Hyper Bridge; proyecto independiente bajo Apache 2.0.
          files: RyxIsla.apk
