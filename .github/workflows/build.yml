name: Build and Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Limpiar cachés de compilación
        run: |
          rm -rf app/build build .gradle app/.gradle 2>/dev/null || true
      - run: gradle clean assembleDebug --no-daemon --rerun-tasks -PbuildNumber=${{ github.run_number }}
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RyxIsland.apk
      - name: Versión
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Ryx Island v${{ steps.ver.outputs.v }}
          body: |
            - Diseño renovado para Island: editor con vista previa en vivo y accesos rápidos a temas, forma, avisos y movimiento.
            - La previsualización muestra un mensaje de ejemplo más realista, pila de avisos e identidad visual cálida.
            - Los accesos rápidos abren directamente los controles correspondientes; se mantienen las secciones detalladas.
          files: RyxIsland.apk
