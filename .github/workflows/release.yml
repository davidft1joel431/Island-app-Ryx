name: Publish Ryx Isla release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read version and verify tag
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          TAG="v$VERSION"
          git rev-parse "refs/tags/$TAG" >/dev/null || {
            echo "Expected tag $TAG is missing" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and lint APK
        shell: bash
        run: |
          set -o pipefail
          attempt=1
          while [ "$attempt" -le 3 ]; do
            log_file="$(mktemp)"
            if ./gradlew --no-daemon :app:lintDebug :app:assembleDebug 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            else
              result=$?
            fi
            if [ "$attempt" -lt 3 ] && grep -Eiq 'Received status code 5[0-9]{2}|HTTP response code: 5[0-9]{2}|502 Bad Gateway|503 Service Unavailable|504 Gateway Time-out|Could not install Gradle distribution|Could not download Gradle distribution|services\.gradle\.org/distributions/gradle-.*-bin\.zip' "$log_file"; then
              echo "Transient dependency server error; retrying Gradle (attempt $((attempt + 1)) of 3)."
              rm -f "$log_file"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
              continue
            fi
            rm -f "$log_file"
            exit "$result"
          done

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk RyxIsla.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ryx Isla v${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: RyxIsla.apk
          body: |
            Ryx Isla v${{ steps.version.outputs.version }}.

            - Nueva interfaz de ajustes con paneles agrupados e inspirados en el diseño Bento de HyperBridge.
            - Modo de juego para ocultar la isla en aplicaciones que Android identifica como juegos.
            - Traducciones al castellano y atribución de David Joel, creador del proyecto en Perú.
            - Conserva los sistemas existentes, la aplicación `com.dav.isla` y la atribución GPLv3 del proyecto de origen.

            **Nota de instalación:** la APK de esta versión usa una firma distinta a la de v2.2.0. Android puede pedir desinstalar la versión anterior antes de instalar esta; la desinstalación puede borrar los datos locales.

            Consulta [la licencia GPLv3](https://github.com/${{ github.repository }}/blob/main/LICENSE) y [la atribución](https://github.com/${{ github.repository }}/blob/main/UPSTREAM.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
