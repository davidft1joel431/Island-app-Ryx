name: Publish Ryx Isla release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read version and verify tag
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          TAG="v$VERSION"
          git rev-parse "refs/tags/$TAG" >/dev/null || {
            echo "Expected tag $TAG is missing" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD repository secret; refusing to publish an unsigned/debug APK." >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/ryxisla-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          KEY_ALIAS="$(keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null | sed -nE 's/^([^,]+),.*/\1/p' | head -n 1)"
          if [ -z "$KEY_ALIAS" ]; then echo "Could not read signing alias from keystore." >&2; exit 1; fi
          {
            echo "SIGNING_STORE_FILE=$KEYSTORE"
            echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build and lint APK
        shell: bash
        run: |
          set -o pipefail
          attempt=1
          while [ "$attempt" -le 3 ]; do
            log_file="$(mktemp)"
            if ./gradlew --no-daemon :app:lintRelease :app:assembleRelease 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            else
              result=$?
            fi
            if [ "$attempt" -lt 3 ] && grep -Eiq 'Received status code 5[0-9]{2}|HTTP response code: 5[0-9]{2}|502 Bad Gateway|503 Service Unavailable|504 Gateway Time-out|Could not install Gradle distribution|Could not download Gradle distribution|services\.gradle\.org/distributions/gradle-.*-bin\.zip' "$log_file"; then
              echo "Transient dependency server error; retrying Gradle (attempt $((attempt + 1)) of 3)."
              rm -f "$log_file"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
              continue
            fi
            rm -f "$log_file"
            exit "$result"
          done

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk RyxIsla.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ryx Isla v${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: RyxIsla.apk
          body: |
            Ryx Isla v${{ steps.version.outputs.version }}.

            - Corrige la reproducción del MP3 general cuando Android marca como silencioso el canal de una notificación normal.
            - Conserva el sonido personalizado de los chats prioritarios y respeta el modo No molestar.
            - Incluye mejoras de notificaciones multimedia, historial y personalización de la pantalla de inicio.
            - Conserva el identificador de paquete para permitir la actualización sobre instalaciones existentes.

            Consulta [la licencia GPLv3](https://github.com/${{ github.repository }}/blob/main/LICENSE) y [los avisos de atribución](https://github.com/${{ github.repository }}/blob/main/UPSTREAM.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
